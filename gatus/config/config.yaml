# praxis 巡检。改这份文件后 Gatus 会自动重载，无需重启。
# 设计见 praxis-loop/servers docs/specs/2026-10-18-gatus-patrol-design.md
storage:
  type: sqlite
  path: /data/data.db

security:
  basic:
    username: "admin"
    password-bcrypt-base64: "${GATUS_ADMIN_PASSWORD_BCRYPT_B64}"

ui:
  title: "praxis 巡检"
  header: "praxis 巡检"

alerting:
  custom:
    url: "${FEISHU_WEBHOOK_PRAXIS_PATROL}"
    method: "POST"
    headers:
      Content-Type: "application/json"
    # 飞书交互卡片。必须含「巡检」二字：机器人设了自定义关键词，缺了会被拒收（而 HTTP 仍是 200）。
    # 标题栏的颜色和标题由 [ALERT_TRIGGERED_OR_RESOLVED] 一并补全（placeholders 的值里带了一段 JSON），
    # 因为 Gatus 只有这一个随状态变化的占位符。改模板后务必把渲染结果当 JSON 校验一遍再上线。
    # 默认模板给存活探测用（有网站、检查条件）；biz 分组（心跳）没有这两项，在 overrides 里换成精简版。
    body: |
      {"msg_type":"interactive","card":{"config":{"wide_screen_mode":true},"header":{"template":"[ALERT_TRIGGERED_OR_RESOLVED]"}},"elements":[{"tag":"div","fields":[{"is_short":true,"text":{"tag":"lark_md","content":"**分组**\n[ENDPOINT_GROUP]"}},{"is_short":true,"text":{"tag":"lark_md","content":"**服务**\n[ENDPOINT_NAME]"}}]},{"tag":"div","text":{"tag":"lark_md","content":"**说明**\n[ALERT_DESCRIPTION]"}},{"tag":"div","text":{"tag":"lark_md","content":"**网站**\n[ENDPOINT_URL]"}},{"tag":"div","text":{"tag":"lark_md","content":"**错误**\n[RESULT_ERRORS] "}},{"tag":"div","text":{"tag":"lark_md","content":"**检查条件**\n[RESULT_CONDITIONS]"}},{"tag":"hr"},{"tag":"action","actions":[{"tag":"button","type":"primary","text":{"tag":"plain_text","content":"打开巡检面板"},"url":"https://status.xanne.cloud/endpoints/[ENDPOINT_GROUP]_[ENDPOINT_NAME]"}]},{"tag":"note","elements":[{"tag":"plain_text","content":"praxis 巡检 · Gatus · status.xanne.cloud"}]}]}}
    placeholders:
      ALERT_TRIGGERED_OR_RESOLVED:
        TRIGGERED: 'red","title":{"tag":"plain_text","content":"🚨 巡检告警'
        RESOLVED: 'green","title":{"tag":"plain_text","content":"✅ 巡检恢复'
    overrides:
      - group: "biz"
        body: |
          {"msg_type":"interactive","card":{"config":{"wide_screen_mode":true},"header":{"template":"[ALERT_TRIGGERED_OR_RESOLVED]"}},"elements":[{"tag":"div","fields":[{"is_short":true,"text":{"tag":"lark_md","content":"**分组**\n[ENDPOINT_GROUP]"}},{"is_short":true,"text":{"tag":"lark_md","content":"**服务**\n[ENDPOINT_NAME]"}}]},{"tag":"div","text":{"tag":"lark_md","content":"**说明**\n[ALERT_DESCRIPTION]"}},{"tag":"div","text":{"tag":"lark_md","content":"**上报内容**\n[RESULT_ERRORS] "}},{"tag":"hr"},{"tag":"action","actions":[{"tag":"button","type":"primary","text":{"tag":"plain_text","content":"打开巡检面板"},"url":"https://status.xanne.cloud/endpoints/[ENDPOINT_GROUP]_[ENDPOINT_NAME]"}]},{"tag":"note","elements":[{"tag":"plain_text","content":"praxis 巡检 · Gatus · status.xanne.cloud"}]}]}}
    default-alert:
      send-on-resolved: true
      failure-threshold: 3
      success-threshold: 1

# 存活探测：每 5 分钟，跟随重定向，要求最终 200、证书剩余 > 7 天。
# 2026-10-18 实测这 17 个地址跟随重定向后都是 200（hydra 根路径会 307 自循环，故用 /health/ready）。
# 2026-10-20 移除 auth、hydra（tencent 上的 Ory 已下线，改用 Zitadel，见 praxis-loop/servers docs/plans/2026-10-20-ory-to-zitadel.md）。
x-probe: &probe
  interval: 5m
  conditions:
    - "[STATUS] == 200"
    - "[CERTIFICATE_EXPIRATION] > 168h"
  alerts:
    - type: custom
      description: "连续 3 次探测失败"

endpoints:
  - { name: okx,           group: sealan,  url: "https://okx.xanne.cloud/",                    <<: *probe }
  - { name: radar,         group: sealan,  url: "https://radar.xanne.cloud/healthz",           <<: *probe }
  - { name: blog,          group: sealan,  url: "https://blog.xanne.cloud/",                   <<: *probe }
  - { name: console,       group: sealan,  url: "https://console.xanne.cloud/healthz",         <<: *probe }
  - { name: pass,          group: sealan,  url: "https://pass.xanne.cloud/",                   <<: *probe }
  - { name: n8n,           group: sealan,  url: "https://n8n.xanne.cloud/",                    <<: *probe }
  - { name: bark,          group: sealan,  url: "https://bark.xanne.cloud/healthz",            <<: *probe }
  - { name: box,           group: sealan,  url: "https://box.xanne.cloud/",                    <<: *probe }
  - { name: market,        group: sealan,  url: "https://market.xanne.cloud/",                 <<: *probe }
  - { name: qd,            group: sealan,  url: "https://qd.xanne.cloud/",                     <<: *probe }
  - { name: nauth-beta,    group: sealan,  url: "https://nauth-beta.xanne.cloud/",             <<: *probe }
  - { name: multica,       group: tencent, url: "https://multica.xanne.cloud/",                <<: *probe }
  - { name: openconnector, group: tencent, url: "https://openconnector.xanne.cloud/",          <<: *probe }
  - { name: xledger,       group: tencent, url: "https://xledger.xanne.cloud/",                <<: *probe }
  - { name: agent-vault,   group: tencent, url: "https://agent-vault.xanne.cloud/",            <<: *probe }

# 业务心跳：由各任务主动上报。
# 注意：Gatus 的心跳定时器不随上报重置，「完全没跑」最坏要近 2 个 interval 才发现。
external-endpoints:
  - name: okx-watchdog
    group: biz
    token: "${GATUS_PUSH_TOKEN_OKX_WATCHDOG}"
    heartbeat: { interval: 45m }
    alerts:
      - type: custom
        failure-threshold: 1
        description: "okx-trade 看门狗 45 分钟没有上报，cron 可能挂了"
  - name: okx-checks
    group: biz
    token: "${GATUS_PUSH_TOKEN_OKX_WATCHDOG}"
    alerts:
      - type: custom
        failure-threshold: 3
        description: "okx-trade 交易链路连续 3 轮检查不通过"
  - name: daily-log
    group: biz
    token: "${GATUS_PUSH_TOKEN_DAILY_LOG}"
    heartbeat: { interval: 26h }
    alerts:
      - type: custom
        failure-threshold: 1
        description: "日报没有按时完成（笔记本没开机也会触发）"
  - name: qd-checkin
    group: biz
    token: "${GATUS_PUSH_TOKEN_QD_CHECKIN}"
    heartbeat: { interval: 26h }
    alerts:
      - type: custom
        failure-threshold: 1
        description: "Trae / WorkBuddy 自动签到异常"
