# SSO 网关（sealan，/opt/docker-deploy/sso-gateway）：给不会讲 OIDC 的服务加一道 Zitadel 登录
# 链路：cloudflared(host 网络) → 127.0.0.1:13030 Caddy ─ forward_auth → 127.0.0.1:4180 oauth2-proxy ─ OIDC → https://id.xanne.cloud
#                                                    └ 通过后 → 各服务本机端口
# 受保护：okx.xanne.cloud(8801)、market.xanne.cloud(5173)、console.xanne.cloud(13010)。加服务：Caddyfile 加站点 + Zitadel 应用加回调 + 隧道规则改指 13030
# 谁能进：Zitadel 项目 praxis-gateway 开了「登录时校验授权」，只有被授予角色 access 的用户能通过；控制台里给人授权即可
# 秘密来自同目录 .env（600，不进 git），值在 agent-vault infra：SSO_GATEWAY_CLIENT_ID / SSO_GATEWAY_CLIENT_SECRET / SSO_GATEWAY_COOKIE_SECRET
name: sso-gateway

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: sso-oauth2-proxy
    restart: unless-stopped
    # host 网络：与 cloudflared、Caddy 一样只绑回环，省掉端口映射
    network_mode: host
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 127.0.0.1:4180
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_PROVIDER_DISPLAY_NAME: Xanne ID
      OAUTH2_PROXY_OIDC_ISSUER_URL: https://id.xanne.cloud
      OAUTH2_PROXY_CLIENT_ID: ${SSO_GATEWAY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${SSO_GATEWAY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${SSO_GATEWAY_COOKIE_SECRET}
      # offline_access：拿 refresh token，配合下面的 COOKIE_REFRESH 定期向 Zitadel 续期
      OAUTH2_PROXY_SCOPE: openid email profile offline_access
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      # 只做认证（forward_auth 的 /oauth2/auth），不当反代
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # 只有本机 Caddy 会连进来；不设的话默认信任任何来源的 X-Forwarded-*
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: 127.0.0.1/32
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # 一个 cookie 覆盖所有 *.xanne.cloud：登录一次，三个站都通
      OAUTH2_PROXY_COOKIE_NAME: _xanne_sso
      OAUTH2_PROXY_COOKIE_DOMAINS: .xanne.cloud
      OAUTH2_PROXY_WHITELIST_DOMAINS: .xanne.cloud
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      # 单点退出：每 5 分钟用 refresh token 向 Zitadel 续期（结果写 Redis，见下）。Zitadel 会话在别处结束后续期失败，
      # oauth2-proxy 退回检查 ID Token，而 Zitadel 实例的 ID Token 有效期已设为 10 分钟，所以最多约 10 分钟后网关拒绝。
      # 不设的话网关只认自己 7 天有效的 cookie，Zitadel 那边退出了这边照样能进
      OAUTH2_PROXY_COOKIE_REFRESH: 5m
      # 会话存 Redis，cookie 里只有会话编号：forward_auth 模式下 oauth2-proxy 写回的新 cookie 到不了浏览器，
      # 用 cookie 存会话的话续期结果丢失、每个请求都拿旧 refresh token 去续（Zitadel 会轮换，必失败）
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://127.0.0.1:6380
      # 谁能进由 Zitadel 的项目授权决定，这里不再按邮箱域过滤
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SILENCE_PING_LOGGING: "true"
      # 退出（/oauth2/sign_out）时由服务端调 Zitadel 结束会话；否则 Zitadel 会话还在，再访问会被静默登回去，看不到登录框
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: "https://id.xanne.cloud/oidc/v1/end_session?id_token_hint={id_token}"
    depends_on:
      - redis
    mem_limit: 64m
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: sso-redis
    restart: unless-stopped
    network_mode: host
    # 只存网关会话，丢了只是大家重新登录一次：不落盘
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6380", "--save", "", "--appendonly", "no", "--maxmemory", "24mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 32m
    logging: *logging

  caddy:
    image: caddy:2.8-alpine
    container_name: sso-caddy
    restart: unless-stopped
    network_mode: host
    environment:
      # console 认网关身份用的共享密钥（与 praxis-console 的 .env 同值），Caddyfile 里以 {$CONSOLE_GATEWAY_SECRET} 引用
      CONSOLE_GATEWAY_SECRET: ${CONSOLE_GATEWAY_SECRET}
    volumes:
      # 挂目录不挂单文件：sed -i / 编辑器保存会换 inode，单文件挂载会一直读旧文件
      - ./caddy:/etc/caddy:ro
    depends_on:
      - oauth2-proxy
    mem_limit: 64m
    logging: *logging
