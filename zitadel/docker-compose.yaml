# Zitadel 身份中心（tencent/tencent-bro，/opt/docker/zitadel）—— 对外 https://id.xanne.cloud
# 设计与取舍：praxis-loop/servers docs/plans/2026-10-20-ory-to-zitadel.md
# 链路：cloudflared(HTTP/1.1) → proxy(Caddy) ─┬─ "/"、"/ui/v2/login*" → zitadel-login:3000
#                                            └─ 其余 → h2c://zitadel-api:8080（OIDC/SAML/gRPC-web/REST/控制台）
# 秘密全部来自同目录 .env（600，不进 git），值的唯一来源是 agent-vault infra vault，见 README。
name: zitadel

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  zitadel-api:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION}
    restart: unless-stopped
    # 与官方模板一致：要以 root 写 bootstrap 卷（登录页 PAT、自动化 PAT）
    user: "0"
    # --masterkeyFromEnv：从 ZITADEL_MASTERKEY 读，不把 masterkey 放进进程参数（官方模板的 --masterkey 会出现在 ps 里）
    command: start-from-init --masterkeyFromEnv
    environment:
      ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY}
      GOMEMLIMIT: 300MiB

      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"

      # shared-postgres（postgres-net 上的 postgres:16），库 zitadel，属主即此非超级用户
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:${ZITADEL_DB_PASSWORD}@shared-postgres:5432/zitadel?sslmode=disable

      # 首个实例：组织与管理员
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: xanne
      ZITADEL_FIRSTINSTANCE_DEFAULTLANGUAGE: zh
      ZITADEL_FIRSTINSTANCE_ORG_NAME: xanne
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${ZITADEL_ADMIN_USERNAME}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: Xanne
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: Admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${ZITADEL_ADMIN_EMAIL}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"

      # 自动化用的服务账号（IAM_OWNER）：PAT 写到 bootstrap 卷，部署后转存 infra/ZITADEL_ADMIN_PAT 并删掉文件
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: automation
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Automation (praxis agents)
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: ${ADMIN_PAT_EXPIRATION}
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat

      # 新版登录页的服务账号（官方模板原样）
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${LOGIN_CLIENT_PAT_EXPIRATION}

      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${ZITADEL_DOMAIN}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/login?samlRequest=

      # 发信：Resend SMTP（465 隐式 TLS；Host 必须带端口）
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: smtp.resend.com:465
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_USER: resend
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD: ${RESEND_API_KEY}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "true"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: ${SMTP_FROM}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: Xanne ID

      # 访问日志不进 stdout：本机 docker 无全局日志轮转，且有 Caddy 一层
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 30s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:rw
    networks: [zitadel, postgres-net]
    mem_limit: 512m
    logging: *logging

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:${ZITADEL_VERSION}
    restart: unless-stopped
    user: "0"
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      ZITADEL_SESSION_COOKIE_SECRET: ${ZITADEL_LOGIN_COOKIE_SECRET}
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_DOMAIN},X-Forwarded-Proto:https
      NODE_OPTIONS: --max-old-space-size=192
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - zitadel-bootstrap:/zitadel/bootstrap:ro
    networks: [zitadel]
    depends_on:
      zitadel-api:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    # 只绑回环；对外经 tencent 的 cloudflared 隧道 id.xanne.cloud
    ports:
      - "127.0.0.1:13003:8080"
    volumes:
      # 挂目录而不是单个文件：sed -i / 编辑器保存会换 inode，单文件挂载会让容器一直读旧文件
      - ./caddy:/etc/caddy:ro
    networks: [zitadel]
    depends_on:
      zitadel-api:
        condition: service_healthy
      zitadel-login:
        condition: service_healthy
    mem_limit: 64m
    logging: *logging

networks:
  zitadel:
    name: zitadel
  postgres-net:
    external: true
    name: postgres-net

volumes:
  zitadel-bootstrap:
